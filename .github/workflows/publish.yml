name: Publish images

# Publishes both container images to GitHub Container Registry, for amd64 and arm64, so
# the machine that runs them never has to build them.
#
# That is not a convenience. A release build of this workspace with LTO wants more memory
# than a small VM has, and the build tool is what falls over rather than the compiler —
# `deploy/quadlet/README.md` says so in as many words. Before this existed the only way to
# get an image onto a server was to build it elsewhere and move a tarball by hand.
#
# ghcr.io rather than Docker Hub because the workflow's own token can push to it: no
# secret to configure, none to rotate, and none to leak.
#
# **Each architecture is built on a runner of that architecture**, not under emulation.
# GitHub gives public repositories arm64 runners, and a release build with LTO through
# QEMU is slow enough to be its own problem — but the reason that matters is the smoke
# test. An image checked under emulation has not been checked on the thing that will run
# it. Nothing here is published without having started, natively, under exactly the
# hardening its quadlet applies.

on:
  push:
    branches: [master]
    # An image is only worth rebuilding when something that ends up inside one changed.
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Containerfile'
      - 'containers/**'
      - 'config/peerConfig.example.toml'
      - '.containerignore'
      - '.github/workflows/publish.yml'
  # Releases are the other trigger, and deliberately a separate one. A `tags:` filter in
  # the block above would be evaluated against the same `paths:` list, and a tag pushed
  # onto an existing commit can present an empty diff -- so the release that most needs an
  # image would be the one silently skipped.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  # ---------------------------------------------------------------------------------
  # One image, one architecture, on a runner of that architecture.
  # ---------------------------------------------------------------------------------
  build:
    runs-on: ${{ matrix.arch.runner }}

    permissions:
      contents: read
      packages: write

    strategy:
      # One image or one architecture failing must not hide the state of the others: all
      # four are independent artefacts with independent reasons to break.
      fail-fast: false
      matrix:
        image:
          - name: anothercrewlink-server
            containerfile: Containerfile
            context: .
          - name: anothercrewlink-coturn
            containerfile: containers/coturn/Containerfile
            context: containers/coturn
        arch:
          - name: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - name: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Names
        id: names
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          image="${REGISTRY}/${owner}/${{ matrix.image.name }}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          # The per-architecture tag is an intermediate: it gives the manifest job
          # something to point at. It stays afterwards, so a single-architecture host can
          # pull one directly if it ever wants to.
          echo "arch_tag=${image}:sha-${GITHUB_SHA::12}-${{ matrix.arch.name }}" >> "$GITHUB_OUTPUT"

      # `--format docker`, and it is not a preference.
      #
      # The OCI image specification has no field for a health check, so `podman build` --
      # which produces OCI by default -- discards the `HEALTHCHECK` line in the
      # Containerfile without a word. The published 0.1.0 images therefore had none, and
      # `Notify=healthy` in the quadlet was rejected outright:
      #
      #     sdnotify policy "healthy" requires a healthcheck to be set
      #
      # Nothing here caught it because the check had been verified on an image built with
      # Docker, which writes schema 2 and keeps it. Docker format is what carries a health
      # check, and that is the whole reason to ask for it.
      - name: Build
        run: |
          podman build --format docker --platform ${{ matrix.arch.platform }} \
            -t "${{ steps.names.outputs.arch_tag }}" \
            -f ${{ matrix.image.containerfile }} ${{ matrix.image.context }}

      # Smoke-tested before it is published, not after, and on the architecture it was
      # built for. An image that cannot start is not worth a tag, and both of these have
      # failed to start for reasons no diff showed: a coturn flag removed upstream, and a
      # capability the binary needs in order to be exec'd at all.
      - name: It starts under the hardening the quadlets apply
        run: |
          set -euo pipefail
          image="${{ steps.names.outputs.arch_tag }}"
          if [ "${{ matrix.image.name }}" = anothercrewlink-server ]; then
            podman run -d --name smoke \
              --read-only --cap-drop=ALL --security-opt=no-new-privileges:true \
              -p 127.0.0.1:9736:9736 "$image"
            for i in $(seq 1 30); do
              curl -fsS http://127.0.0.1:9736/health > /dev/null && { echo "healthy after ${i}s"; break; }
              sleep 1
            done
            curl -fsS http://127.0.0.1:9736/health
          else
            podman run -d --name smoke \
              --read-only --tmpfs /tmp:rw,noexec,nosuid,nodev,size=1m \
              --cap-drop=ALL --cap-add=NET_BIND_SERVICE --security-opt=no-new-privileges:true \
              -e TURN_SECRET=publish-smoke-test -e TURN_EXTERNAL_IP=203.0.113.10 "$image"
            for _ in $(seq 1 30); do
              podman logs smoke > smoke.log 2>&1 || true
              grep -q "Black listing" smoke.log && break
              sleep 1
            done
            # Into a file, never through `| grep -q`: grep exits on the first match, logs
            # takes a SIGPIPE for it, and a pipefail shell then calls a found pattern a
            # failure. That cost a red master once already.
            grep -q "Black listing" smoke.log || { cat smoke.log; exit 1; }
            echo "coturn reached its peer deny list"
          fi
          # And it is the architecture it claims to be. The Containerfiles used to pin
          # single-architecture base digests, which made a build for the wrong target fail
          # outright; they pin index digests now so that arm64 is possible at all, and this
          # is what replaced that guarantee.
          # The health check has to have survived the build. This is the assertion the
          # 0.1.0 images needed and did not have: they started, answered /health, and were
          # published carrying no health check at all -- which surfaced only as a quadlet
          # systemd refused to start.
          if [ "${{ matrix.image.name }}" = anothercrewlink-server ]; then
            podman image inspect "$image" --format '{{.Config.Healthcheck.Test}}' > hc.txt
            grep -q acl-healthcheck hc.txt \
              || { echo "no health check in the image -- is --format docker still set?"; cat hc.txt; exit 1; }
            echo "health check: present"
          fi
          got=$(podman image inspect "$image" --format '{{.Architecture}}')
          [ "$got" = "${{ matrix.arch.name }}" ] || { echo "built $got, expected ${{ matrix.arch.name }}"; exit 1; }
          echo "architecture: $got"
          podman rm -f smoke > /dev/null

      # Into the Docker-format credential file, not podman's own. `podman login` writes
      # `$XDG_RUNTIME_DIR/containers/auth.json`; the attestation action reads
      # `~/.docker/config.json`. Same format, different path, and one `--authfile` puts a
      # single login where both look.
      - name: Log in to the registry
        run: |
          mkdir -p "$HOME/.docker"
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | podman login "${REGISTRY}" -u "${{ github.actor }}" --password-stdin \
                --authfile "$HOME/.docker/config.json"

      - name: Push the per-architecture tag
        run: |
          podman push --authfile "$HOME/.docker/config.json" \
            "${{ steps.names.outputs.arch_tag }}"

  # ---------------------------------------------------------------------------------
  # One manifest list per image, so a plain `podman pull` gets the right architecture.
  # ---------------------------------------------------------------------------------
  manifest:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      # For the build provenance attestation below.
      id-token: write
      attestations: write

    strategy:
      fail-fast: false
      matrix:
        name: [anothercrewlink-server, anothercrewlink-coturn]

    steps:
      - name: Names and tags
        id: tags
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          image="${REGISTRY}/${owner}/${{ matrix.name }}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          # Every image is addressable by the commit that produced it, always. The moving
          # tags are additional, never the only way back to a build.
          tags="${image}:sha-${GITHUB_SHA::12}"
          # `v0.1.0` is the git convention and `0.1.0` is the image convention, so the
          # prefix is stripped here rather than one of the two being bent. The image tag
          # then matches the version in Cargo.toml exactly, which is what a runbook saying
          # "we are on 0.1.0" needs it to do.
          release_tag="${{ github.event.release.tag_name }}"
          if [ -n "${release_tag}" ]; then
            tags="${tags} ${image}:${release_tag#v} ${image}:latest"
          else
            tags="${tags} ${image}:edge"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "Publishing: ${tags}"

      - name: Log in to the registry
        run: |
          mkdir -p "$HOME/.docker"
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | podman login "${REGISTRY}" -u "${{ github.actor }}" --password-stdin \
                --authfile "$HOME/.docker/config.json"

      - name: Assemble and push the manifest list
        id: push
        run: |
          set -euo pipefail
          image="${{ steps.tags.outputs.image }}"
          sha="sha-${GITHUB_SHA::12}"
          podman manifest create "${image}:${sha}-list"
          for arch in amd64 arm64; do
            podman manifest add --authfile "$HOME/.docker/config.json" \
              "${image}:${sha}-list" "docker://${image}:${sha}-${arch}"
          done
          for t in ${{ steps.tags.outputs.tags }}; do
            # `--all` pushes the per-architecture manifests the list refers to, not only
            # the list. Without it a puller on one architecture is handed a reference to
            # something the registry does not have under this tag.
            podman manifest push --all --authfile "$HOME/.docker/config.json" \
              --digestfile digest.txt "${image}:${sha}-list" "docker://${t}"
          done
          # The digest the registry stored, reported by the push rather than read back
          # from a local record: an attestation is bound to one exact set of bytes, and a
          # digest that is merely close is a 404.
          digest=$(cat digest.txt)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Published ${image}@${digest}"

      # Says which workflow, from which commit, built these exact bytes. Verifiable with
      # `gh attestation verify`, and consistent with the rest of this repository's supply
      # chain: the binary already carries its dependency list, and now the image carries
      # its provenance. Attached to the manifest list, so one attestation answers for
      # both architectures.
      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.tags.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Summary
        run: |
          {
            echo "### ${{ matrix.name }}"
            echo
            echo '```'
            echo "${{ steps.tags.outputs.image }}@${{ steps.push.outputs.digest }}"
            echo '```'
            echo
            echo "linux/amd64 + linux/arm64"
            echo
            for t in ${{ steps.tags.outputs.tags }}; do echo "- \`$t\`"; done
          } >> "$GITHUB_STEP_SUMMARY"
