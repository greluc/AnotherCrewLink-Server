name: Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          cache: npm

      # npm ci installs strictly from the lockfile and fails if package.json and
      # the lockfile disagree, so a build can never silently resolve something else.
      - name: Install Dependencies
        run: npm ci

      # Fails the build if a dependency picks up a high or critical advisory.
      - name: Audit Dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Compile
        run: npm run build

      # Starts the built server and drives it over socket.io, so the lobby bookkeeping
      # is checked the way a client sees it.
      - name: Test
        run: npx vitest run

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build image
        run: docker build -t anothercrewlink-server:ci .
