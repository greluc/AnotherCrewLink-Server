name: Live check

# Asks a running deployment whether it works, from outside its own network.
#
# That last part is the whole reason this exists. Everything else can be checked from a
# workstation, but the workstation this was written on shares a line with the server —
# so every packet it sends to the relay takes the NAT hairpin, sees a private source
# address, and proves nothing about the path a player takes. A GitHub runner is somewhere
# else, which is the only property it needs to have.
#
# What it can therefore establish, and nothing else can:
#
#   * the signalling server is reachable over the public internet
#   * the relay it advertises is a name that resolves from outside
#   * the TURN port is forwarded and answering from outside
#   * a credential the server issued is accepted for a real allocation
#   * traffic actually relays through it
#
# Weekly and on demand, not on every push. Nothing here tests this repository's code —
# it tests a deployment, which changes when somebody deploys, not when somebody commits.

on:
  schedule:
    # Weekly, an hour offset from the other scheduled job so two failures do not arrive
    # together and get read as one.
    - cron: '41 6 * * 1'
  workflow_dispatch:
    inputs:
      url:
        description: The server to check
        required: false
        default: https://aucl.greluc.me

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x

      - name: Install the socket.io client
        run: npm ci

      # The signalling half: connect, be told how to reach the relay, join, be told who
      # else is there, exchange a signal, leave. Two sockets, a lobby code no game can
      # produce, and nothing published to anybody's lobby browser.
      #
      # `continue-on-error`, and it is the point rather than laxity. The first run of this
      # workflow stopped here on a misconfiguration -- two clients sharing a credential --
      # and so never asked the question it exists to ask, which is whether the relay is
      # reachable from out here at all. A check that prevents a later, more important
      # check from running has cost more than it found.
      - name: The signalling server, from outside
        id: probe
        continue-on-error: true
        run: |
          set -o pipefail
          url="${{ inputs.url || 'https://aucl.greluc.me' }}"
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          node tests/live-probe.mjs "$url" > relay.json
          echo "relay offer: $(cat relay.json)"

      # The relay half, and the part only a machine outside the server's network can do.
      # coturn's own client, so the thing doing the asking did not come from this project,
      # and `-y` so it allocates and relays rather than only binding.
      - name: The relay it advertises, from outside
        id: relay
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ "$(node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(String(JSON.parse(s).relay===null)))' < relay.json)" = true ]; then
            echo "::error::the server advertises no TURN relay, so there is nothing to reach from out here"
            exit 1
          fi
          read -r host port user cred <<EOF
          $(node -e '
            let s = "";
            process.stdin.on("data", (d) => (s += d)).on("end", () => {
              const r = JSON.parse(s).relay;
              const u = [].concat(r.urls)[0].replace(/^turns?:/, "").split("?")[0];
              const [host, port] = u.split(":");
              process.stdout.write([host, port || "3478", r.username, r.credential].join(" "));
            });
          ' < relay.json)
          EOF
          echo "allocating on ${host}:${port} as ${user}"

          # The peer has to be a public address, and `-y` does not give one.
          #
          # `-y` tells the client to relay to its own address -- which inside a container
          # is private, so our own peer deny list refuses the channel bind with 403. The
          # first run of this step read that as "the relay is unreachable" when it was
          # nothing of the sort: a 403 on the *channel bind* means the packets arrived,
          # the credential was accepted and the allocation succeeded. Only the peer was
          # refused, correctly, by us.
          #
          # So name the runner's public address instead. Nothing is listening on it, so no
          # packet comes back and that is fine -- what is being asked is whether coturn
          # will allocate and bind for a client on the far side of the internet.
          public_ip=$(curl -fsS --max-time 10 https://api.ipify.org)
          echo "peer: ${public_ip} (this runner, from outside the server's network)"

          # Pulled rather than built: this job is about a deployment, and waiting on a
          # compile to ask a question about somebody else's server is time spent for
          # nothing.
          podman run --rm --entrypoint turnutils_uclient \
            ghcr.io/greluc/anothercrewlink-coturn:latest \
            -u "$user" -w "$cred" -p "$port" -n 2 -e "$public_ip" "$host" 2>&1 \
            | tee uclient.log || true

          # Classified rather than reduced to pass/fail, because the three ways this can
          # go wrong are fixed by three different people.
          if grep -qiE "start_mclient|total transmit time" uclient.log; then
            echo "the relay allocated and bound for a client outside the network"
          elif grep -qiE "401|unauthori[sz]ed|wrong credentials" uclient.log; then
            echo "::error::${host}:${port} answered, but refused the credential the server issued -- TURN_SECRET differs between the two, or the port is forwarded to a different host than the one signalling points at"
            exit 1
          elif grep -qi "403" uclient.log; then
            echo "::error::${host}:${port} allocated but refused ${public_ip} as a peer -- check --denied-peer-ip"
            exit 1
          else
            echo "::error::no usable answer from ${host}:${port} -- check that UDP ${port} and the relay range are forwarded to this host"
            exit 1
          fi

      # Both answers, then the verdict. Reported separately because they fail for
      # unrelated reasons and are fixed by different people: the first is the server's
      # configuration, the second is a router.
      - name: Verdict
        run: |
          probe='${{ steps.probe.outcome }}'
          relay='${{ steps.relay.outcome }}'
          {
            echo "### ${{ steps.probe.outputs.url }}"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| signalling, from outside | ${probe} |"
            echo "| relay reachable from outside | ${relay} |"
            echo
            echo "Checked from a GitHub runner, outside the server's own network — the one"
            echo "thing a workstation sharing a line with the server cannot do."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "signalling: ${probe}"
          echo "relay:      ${relay}"
          [ "${probe}" = success ] && [ "${relay}" = success ]
