name: Rust

concurrency:
  # Includes the workflow name, for the reason spelled out in codeql.yml: without it
  # every workflow on the same ref shares one group and they cancel each other.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Nothing here is reused between runs, so incremental artefacts are written and then
  # thrown away.
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The wire test starts the server and drives it with a real socket.io-client from
      # Node, which is the only check in the crate that can catch a protocol mistake
      # rather than a logic one. Without these two steps it skips itself and the run is
      # green while having checked less than it looks like.
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install the reference client
        # The only npm dependency in this repository: the socket.io-client that
        # tests/wire.rs drives against the server. Installed strictly from the lockfile.
        run: npm ci

      # rust-toolchain.toml pins 1.98.0 and names rustfmt and clippy, so rustup installs
      # exactly that on the first cargo invocation. Doing it in a step of its own means a
      # toolchain problem reports itself as a toolchain problem.
      - name: Install the pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version
          cargo --version

      # cargo fmt resolves no dependencies and takes no --locked; every command below
      # that does resolve them has it.
      - name: Check formatting
        run: cargo fmt --check

      - name: Build
        run: cargo build --locked --all-targets

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

  deny:
    # Advisories, licences, duplicate versions and crate sources — the policy is in
    # deny.toml. Split out so a supply-chain failure is legible at a glance
    # and does not hide behind a compile error.
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain

      # Pinned to the version this policy was written and verified against. cargo-deny
      # reads deny.toml and its schema moves between releases, so an unpinned install
      # would let an upstream release turn a green gate red with nothing changed here.
      # --locked builds it from its own committed lockfile.
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2

      # Runs advisories, bans, licenses and sources. --locked is cargo-deny's own flag
      # and it forwards to the cargo metadata call underneath, so the check reads the
      # committed Cargo.lock instead of resolving a fresh one.
      - name: Check dependencies
        run: cargo deny --locked check

  images:
    # The images are what gets deployed, and they are the one artefact whose build can
    # break without any Rust changing -- a base image tag moving is enough.
    #
    # Built and run with **podman**, because that is the deployment runtime. Building with
    # one engine and deploying with another would leave the interesting failures for the
    # server to find.
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build both images
        run: |
          podman build -t anothercrewlink-server:ci -f Containerfile .
          podman build -t anothercrewlink-coturn:ci -f containers/coturn/Containerfile containers/coturn

      # A shell-less image cannot be smoke-tested with `run ... sh -c`, so this starts it
      # the way a quadlet does and asks its own healthcheck binary.
      - name: The server starts under the quadlet's hardening
        run: |
          podman run -d --name acl-ci             --read-only --cap-drop=ALL --security-opt=no-new-privileges:true             -p 127.0.0.1:9736:9736 anothercrewlink-server:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9736/health > /dev/null; then
              echo "healthy after ${i}s"
              curl -fsS http://127.0.0.1:9736/health
              podman rm -f acl-ci > /dev/null
              exit 0
            fi
            sleep 1
          done
          echo "server did not become healthy"
          podman logs acl-ci
          exit 1

      # coturn only announces a bad flag by refusing to start, and its hardening only
      # announces itself by the container failing to exec. Both have happened here, and
      # neither shows up in a diff.
      - name: coturn starts under the quadlet's hardening
        run: |
          podman run -d --name turn-ci             --read-only --tmpfs /tmp:rw,noexec,nosuid,nodev,size=1m             --cap-drop=ALL --cap-add=NET_BIND_SERVICE --security-opt=no-new-privileges:true             -e TURN_SECRET=ci-smoke-test -e TURN_EXTERNAL_IP=203.0.113.10             anothercrewlink-coturn:ci
          sleep 5
          podman logs turn-ci > turn-ci.log 2>&1 || true
          cat turn-ci.log
          # Into a file rather than through `| grep -q`: grep exits on the first match,
          # `logs` takes a SIGPIPE for it, and a shell with pipefail then reports a
          # failure for a pattern that was found. That is not this step's shell today,
          # and writing it the safe way costs nothing.
          grep -q "Black listing" turn-ci.log             || { echo "coturn did not reach its peer deny list"; exit 1; }
          podman rm -f turn-ci > /dev/null

  deployment:
    # The pair, driven by five real socket.io clients, ending with coturn being asked to
    # accept a credential this server derived. That last step is the only way to find out
    # whether the two halves of the shared-secret scheme agree, because the answer lives
    # inside coturn.
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x

      - name: Install the socket.io client
        run: npm ci

      - name: Run the deployment verification
        run: tests/deployment.sh
