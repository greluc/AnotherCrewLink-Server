version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # The only npm dependency left is the reference socket.io-client the wire test
  # drives. It has to track the client library the shipping clients actually use,
  # or the test stops proving what it claims to.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  # Actions are pinned to commit SHAs, which means nothing here moves unless
  # Dependabot moves it. Without this the pins silently rot.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  # Keeps the builder and runtime base images current. The ecosystem is still called
  # `docker` after the move to Podman -- that is Dependabot's name for OCI base images,
  # not a runtime. **Unverified:** the file is now `Containerfile`, and whether Dependabot
  # detects that name as reliably as `Dockerfile` has not been established here. Both
  # images are digest-pinned, so nothing moves on its own either way; what would be lost
  # is the pull request proposing a newer digest, and the CI build on every push still
  # fails if a pinned base disappears.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
