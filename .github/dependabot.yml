version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    versioning-strategy: increase
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # Actions are pinned to commit SHAs, which means nothing here moves unless
  # Dependabot moves it. Without this the pins silently rot.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  # Keeps the base image in the Dockerfile on a current Node 24 patch release.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
