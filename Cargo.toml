[package]
name = "acl-server"
version = "0.1.6"
edition = "2024"
rust-version = "1.98.0"
license = "GPL-3.0-or-later"
description = "Signalling server for AnotherCrewLink"
publish = false

[dependencies]
axum = "0.8.9"
socketioxide = { version = "0.18.6", default-features = false, features = ["tracing", "extensions", "state"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["cors", "limit", "timeout", "trace", "catch-panic"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
dashmap = "6"
toml = "0.9"
futures-util = "0.3"
async-stream = "0.3"
# Ephemeral TURN credentials (coturn's `use-auth-secret`): base64 of HMAC-SHA1 over the
# username. Three small, single-purpose RustCrypto/standard crates rather than a TLS stack
# -- the alternative is a static password handed to every player forever, which is what
# this replaces. SHA-1 is not a choice here: it is what coturn computes, and this has to
# produce the same bytes.
hmac = "0.12"
sha1 = "0.10"
base64 = "0.22"

[dev-dependencies]
# Tests talk to this server over plain HTTP on the loopback interface, so no TLS.
# The wire test reads the server's JSON report; nothing here talks HTTP itself,
# because the reference client does that from Node.
serde_json = { version = "1.0.151", features = ["raw_value"] }

[profile.release]
strip = true
lto = "thin"
