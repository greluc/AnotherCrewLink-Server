# The signalling server and its TURN relay.
#
#     cp .env.example .env    # edit it
#     docker compose up -d
#
# Two containers, not one, and that is a decision rather than an accident -- see the
# "Why coturn is not in the server image" section of deploy/README.md. What they do share
# is this file and one `.env`: every coturn setting below is derived from the same
# variables the server reads, so there is nothing to keep in sync by hand.
services:
  server:
    build: .
    restart: unless-stopped
    ports:
      # Loopback, not 0.0.0.0. TLS terminates at the reverse proxy in front of this;
      # publishing publicly would put a plaintext WebSocket endpoint on the internet.
      - '127.0.0.1:9736:9736'
    environment:
      HOSTNAME: ${PUBLIC_HOSTNAME}
      # What / and /health report, so an operator can tell which address a
      # reverse-proxied instance believes it is serving.
      ADDRESS: https://${PUBLIC_HOSTNAME}
    volumes:
      - ./config:/app/config:ro

    # Hardening. Each line here is a capability the process does not get back, and the
    # image was smoke-tested under exactly this set: it binds one TCP socket, reads one
    # config file and writes nothing.
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    # The image has no shell and no libc, so there is nothing in it to escalate *to*;
    # these stop the container being a useful place to land even so.

  # coturn is the standard TURN implementation, actively maintained, and 4.17.2 is the
  # current stable (2026-08-10). Pinned to the Alpine build on the same Alpine the server
  # image uses, so one distribution's advisories cover both.
  coturn:
    # Built here rather than pulled, and the layer is one shell script: upstream's image
    # cannot follow a public address that changes, and on a residential line it does. See
    # deploy/coturn-dynamic-ip.md, which also lists what the router and the line have to
    # provide for any of this to work.
    build: ./docker/coturn
    restart: unless-stopped

    # **Host networking, and it is not optional in any deployment that has to work.**
    #
    # A TURN relay hands each allocation one UDP port out of a range and then tells the
    # client to send to it. Behind a bridge NAT the port a client is told and the port the
    # relay actually holds have to be the same number, so a published range must map 1:1 --
    # and publishing a range at all costs one forwarded socket per port. The upstream
    # default range is 49152-65535: sixteen thousand of them. Under rootless Docker or
    # Podman that is per-port work in rootlesskit or pasta, and it does not come up.
    #
    # If you must run bridged -- see deploy/README.md -- narrow TURN_MIN_PORT/TURN_MAX_PORT
    # hard and publish that range 1:1. Host networking avoids the whole question.
    network_mode: host

    environment:
      # Leave TURN_EXTERNAL_IP unset on a dynamic line: the entrypoint then discovers the
      # address and rechecks it on this interval, restarting coturn only when it really
      # changed. Set it to a literal address on a line that has a fixed one, and no
      # discovery request is ever made.
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:-}
      TURN_IP_CHECK_INTERVAL: ${TURN_IP_CHECK_INTERVAL:-300}

    # `--external-ip` is *not* here. The entrypoint prepends it, because it is the one
    # argument that cannot be written down ahead of time.
    command:
      - --listening-port=${TURN_PORT:-3478}
      - --min-port=${TURN_MIN_PORT:-49160}
      - --max-port=${TURN_MAX_PORT:-49360}
      - --realm=${PUBLIC_HOSTNAME}
      # Ephemeral credentials, computed from one shared secret. This is the setting that
      # removes the thing that used to need configuring twice: with `--lt-cred-mech` and
      # a `--user=`, the same username and password had to be written here *and* into
      # config/peerConfig.toml, and had to match. Now both sides derive from TURN_SECRET.
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET}
      - --fingerprint
      # Relay only. Without these a public TURN server is an open proxy into the loopback
      # and private ranges of the host it runs on, which is how TURN servers end up in
      # other people's incident reports.
      - --no-multicast-peers
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=::1
      - --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      - --denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      # No admin surface at all.
      - --no-cli
      - --no-tlsv1
      - --no-tlsv1_1
      - --pidfile=/tmp/turnserver.pid

    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=1m
    # coturn needs to bind its listening port and nothing else. Drop everything, then add
    # back the one capability a port below 1024 requires -- and if TURN_PORT is 1024 or
    # above, delete these two lines as well.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
