# What every client is told when it connects.
#
# Copy to `peerConfig.toml` and edit. The path is overridable with the PEER_CONFIG
# environment variable. TOML rather than YAML: the maintained YAML crates for Rust
# depend on an archived machine translation of libyaml, and this file is a handful of
# fields.

# Refuse direct peer-to-peer connections and route everything through the relay below.
# Hides players' IP addresses from each other, at the cost of the relay's bandwidth.
force_relay_only = false

# STUN — a client discovering its own public address — needs no entry here.
#
# When the relay below is enabled, `stun:<its host>:<its port>` is advertised alongside
# it automatically. A TURN server has to answer plain Binding requests (RFC 8656 §3.1),
# so the relay already is this deployment's STUN server and there is nothing else to run.
#
# This used to default to Google's public server. It no longer does, for two reasons:
# every player of every deployment revealed their address to a third party before saying
# a word, and that server rate-limits — measured from one network it answered once and
# then refused eight times running, while the same request from a datacentre always
# succeeded. Neither is a good thing to have in the path of a lobby.
#
# Extra servers can still be listed, and are advertised exactly as written, before the
# derived ones. Add one only if you have a reason to:
#
#   [[ice_servers]]
#   urls = "stun:stun.example.com:3478"
#
# With no relay and no entry here, clients are told about no ICE servers at all and will
# only reach players on their own network. The server logs a warning when that happens.

# The TURN relay is a separate container — see deploy/quadlet/ — and this only tells
# clients how to reach it. It is advertised twice, over UDP and over TCP: a `turn:` URL
# with no transport parameter means UDP, and a client on a network that blocks outbound
# UDP cannot reach the relay at all — which is exactly the sort of network that needed a
# relay to begin with. Anything here is handed to every client that connects, so
# treat the credentials as public and rotate them if they ever gate something that
# matters.
#
# **Credentials are no longer set here** if TURN_SECRET is in the environment. coturn takes
# that value as --static-auth-secret and this server derives a time-limited credential per
# client from the same one, so `username` and `credential` below are ignored and a warning
# says so at start-up. They remain for deployments that have not moved yet.
[relay]
enabled = false
# Defaults to the HOSTNAME environment variable when omitted. It is also the host the
# advertised STUN entry is built from, so it has to be a name clients can resolve.
# host = "turn.example.com"
port = 3478
username = ""
credential = ""
