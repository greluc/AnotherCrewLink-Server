# Rename this file to peerConfig.yml to use it.
#
# AnotherCrewLink connects players peer to peer, so every player has to be able to
# reach every other player somehow. This file controls how that is arranged.

# Route all audio through a TURN relay instead of connecting players directly. This
# hides players' IP addresses from each other, at the cost of bandwidth on the relay.
# Requires a working relay below.
forceRelayOnly: false

# A TURN relay to advertise to clients.
#
# The relay is a separate service, not part of this server. Use coturn: the bundled
# docker-compose.yml starts one alongside this server and is wired to these values.
# The previous built-in relay used node-turn, which has been unmaintained since 2022.
relay:
  enabled: false
  # Defaults to the HOSTNAME environment variable when omitted.
  #host: turn.example.com
  port: 3478
  # CHANGE THESE. Anything published here can be used by anyone to relay traffic
  # through your server at your expense.
  username: ''
  credential: ''

# Additional STUN/TURN servers advertised to clients, in the order they should be
# tried. Google's public STUN server is enough for direct connections in most cases.
iceServers:
  - urls: 'stun:stun.l.google.com:19302'
  #- urls: 'turn:turn.example.com:3478'
  #  username: 'TurnUsername'
  #  credential: 'TurnPassword'
